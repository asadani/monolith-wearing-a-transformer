# A Monolith Wearing a Transformer -- book-forge configuration.
#
# Flow mode: a ~30-page journal for engineering leadership, one continuous page
# on screen, paginated in print. Research workspace lives in research/ -- 19
# captured sources, 31 claims, each <sup class="cite">c-0NN</sup> resolving to a
# row in research/claims.jsonl.

slug: monolith-wearing-a-transformer
title: "A Monolith Wearing a Transformer"
subtitle: "What we un-learned about decoupling"
theme: sheet-oxblood

source:
  template: book.html.in
output:
  html: index.html
  pdf: monolith-wearing-a-transformer.pdf

page:
  size: A4

cover:
  art: assets/monolith-wearing-a-transformer-cover.png
  fit: crop
  trim_top_share: 0.47
  dpi: 300

qr:
  - slot: QR_AUTHOR
    target: https://anujsadani.in
    label: "Writing and work"
  - slot: QR_TECH
    target: https://tech.anujsadani.in/monolith-wearing-a-transformer/
    label: "This paper, and the evidence"

folio:
  font: IBMPlexMono-Regular.ttf
  size: 8
  color: [0.49, 0.52, 0.58]
  skip_pages: [1]
  first_number: 1

matter:
  mode: flow
  front:
    heading: "Copyright, permissions, and how this was made"
    anchor_before: '<!-- BOOK-FORGE:AFTER-COVER -->'
    work_line: "A Monolith Wearing a Transformer &mdash; a verified inquiry into
      whether domain foundation models belong in the critical path of payment
      infrastructure."
    # The shared "verified" variant in book-forge calls the work a book. This is
    # a 29-page paper, and the body says "paper" throughout; an inline override
    # keeps the two halves of the document telling the reader the same thing.
    ai_disclosure_html: |
      <h3>A note on how this paper was written</h3>

      <p>An AI system drafted this paper. Not "assisted with" &mdash; drafted it,
        from the research through to the prose you are reading. I set the question
        and its boundaries, made the judgment calls, argued with the drafts, and
        put my name on the result. The errors are mine; the model does not get to
        share the blame.</p>

      <p>If that makes you wince, I understand the reflex. The internet is full of
        confident, sourceless, frictionless text, and the reasonable response has
        been to distrust anything that reads too smoothly. But the objection worth
        taking seriously is not that a machine wrote it. It is that nobody checked
        it.</p>

      <p>That objection is the subject of this paper, which is the awkward part.
        Section 1 is about a machine-generated document that specified a latency
        figure with no source behind it. This one was built the other way round:
        sources captured to disk and hashed before a word was drafted, every
        factual sentence bound to an exact quotation inside one of those files,
        and a verification gate that refused to let the text ship until each
        binding checked out. Thirty-one claims went into the ledger; one failed
        and is cited nowhere in these pages. Two more were withdrawn mid-draft,
        once the publications they rested on turned out to say something other
        than what they had been reported as saying. Section 6 names one of those out loud, because a
        paper making this argument does not get to correct itself quietly.</p>

      <p>The superscripts are not decoration &mdash; they are the audit trail, and
        you can walk it yourself in an afternoon. That is the arrangement I would
        like to see become normal: let the machine draft, and make the drafting
        answer for itself. If you compose every sentence by hand, full respect
        &mdash; the craft shows. And if you notice the em-dashes, they are mine. I
        have always written this way. Make your peace with them.</p>
      <!-- No sign-off here: front-matter.html.j2 emits <p class="signoff">
           from author.initials immediately after this block. -->
    sources_html: |
      <p>The sources are a separate matter. This paper is published alongside a
        free companion archive &mdash; <span class="mono">tech.anujsadani.in/monolith-wearing-a-transformer</span>
        &mdash; holding a saved copy of every source it cites, so that any claim can
        be checked years from now even if the original page has moved or vanished.
        Those saved copies remain the property of the publishers who wrote them and
        are kept only as evidence.</p>
      <p>Two claims in an earlier draft reached this paper at one remove &mdash; a
        practitioner's account of Adyen's and Stripe's published work rather than
        those publications themselves. Both were replaced with the primary sources
        before publication, and both changed on contact with them; Section 6 says
        how. One further claim, on the bulkhead pattern, cites an encyclopedia's
        account of a book this author did not open, and Section 3 states that in
        the text rather than here.</p>
    imprint: "First edition &middot; August 2026"
  about:
    heading: "About the author"
    anchor_before: '<!-- BOOK-FORGE:BEFORE-END -->'
    qr_override:
      - index: 1
        # author.yaml's shared card says "This book"; this is a paper.
        label: "This paper, and the evidence"
        blurb: "Read this online, walk the claim ledger, open every source."
        code: "tech.anujsadani.in"
  # A colophon says how the thing was made. Restating the title and the URL here
  # only repeated the work line on page 3 and the QR card directly above it.
  colophon_html: |
    Set in Source Serif 4, Archivo and IBM Plex Mono.<br>
      Nineteen sources captured and hashed, thirty-one claims bound to quotation,
      one of them failed. First edition, 2026.

license:
  id: all-rights-reserved

edition: "First edition"
date: 2026

links:
  read_online: https://tech.anujsadani.in/monolith-wearing-a-transformer/

verify:
  cover_probes: ["Monolith"]
  body_probes:
    # One probe per section, each a phrase that is load-bearing rather than
    # decorative -- if the phrase is gone, the section's argument changed.
    - "does not exist"                                    # 1
    - "below a bar its own peers"                         # 2
    - "will not cascade to other components"              # 3
    - "in a critical flow"                                # 4
    - "medium-sized data"                                 # 5
    - "atomic embeddings"                                 # 6
    - "mean time to attribution"                          # 7
    - "at a fixed 1% action rate"
  matter_probes:
    - "Copyright, permissions"
    - "About the author"
  allow_system_fonts: false
  min_images: 0
  expect_pages: 29
  page_tolerance: 4
